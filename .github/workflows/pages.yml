name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/godot/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q /tmp/godot/templates.tpz \
            "templates/version.txt" \
            "templates/web_nothreads_release.zip" \
            -d /tmp/godot
          cp /tmp/godot/templates/version.txt /tmp/godot/templates/web_nothreads_release.zip \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Export browser build
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/play site/fonts
          cp assets/fonts/Silkscreen-Regular.ttf site/fonts/Silkscreen-Regular.ttf
          cp assets/icon.png site/icon.png
          cp -a site/. _site/
          cp -a build/web/. _site/play/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
